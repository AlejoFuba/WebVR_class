<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banksy - Museo VR</title>
    <!-- libreria aframe -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <!-- componente de interactividad -->
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
    <!-- componente para fuentes personalizadas -->
    <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
</head>
<body>
    <!-- aqui van los recursos del proyecto  -->
    <a-assets>
        <img src="./assets/Piso.jpg" id="piso">
        <img src="./assets/Muros.jpg" id="muros">
        <img src="./assets/Techo.jpg" id="techo">
        <!-- Obras -->
         <img src="./assets/Anti-ImmigrationBirds.png" id="Anti-ImmigrationBirds">
         <img src="./assets/BombHugger.png" id="BombHugger">
         <img src="./assets/KissingCoppers.jpg" id="KissingCoppers">
         <!-- modelos 3d -->
        <a-assets-item id="cuadro" src="./assets/banksy.glb"></a-assets-item>
        <a-assets-item id="vandalized" src="./assets/vandalized_3d.glb"></a-assets-item>
    </a-assets>
    <!-- escena del proyecto VR -->
    <a-scene xr-mode-ui="enterAREnabled: false">
        <!-- camara de la escena  -->
        <a-entity camera look-controls position="0 1.6 2.5">
            <!-- agregamos el cursor a la camara  -->
            <a-cursor fuse="true" fuse-timeout="1500">
            </a-cursor>
        </a-entity>

        <!-- 
        ---------------------------
                ESTRUCTURA 
        ---------------------------
        -->
        <!-- Piso -->
        <a-plane src="#piso" material="repeat: 5 5; roughness: 0.3" rotation="-90 0 0" width="10" height="10"></a-plane>
        <!-- Muro fondo -->
        <a-plane src="#muros" material="repeat: 3 3; roughness: 1" geometry="height: 4; width: 10" position="0 2 -5"></a-plane>
        <!-- Muro Izquierda -->
        <a-plane src="#muros" material="repeat: 3 3; roughness: 1" geometry="height: 4; width: 10" position="-5 2 0" rotation="0 90 0"></a-plane>
        <!-- Muro Derecha -->
        <a-plane src="#muros" material="repeat: 3 3; roughness: 1" geometry="height: 4; width: 10" position="5 2 0" rotation="0 -90 0"></a-plane>
        <!-- Muro frente -->
        <a-plane src="#muros" material="repeat: 3 3; roughness: 1" geometry="height: 4; width: 10" position="0 2 5" rotation="0 180 0"></a-plane>
        <!-- Techo -->
        <a-plane src="#techo" material="repeat: 3 3; metalness: 0.3; roughness: 0.2" position="0 4 0" rotation="90 0 0" width="10" height="10"></a-plane>
        
        <!-- 
        ---------------------------
                OBRAS Y MODELOS
        ---------------------------
        -->
        <a-plane src="#BombHugger" geometry="height: 1; width: 0.42" position="-3 1.2 -4.9" scale="2.5 2.5 2.5" material="transparent: true"
                event-set__enter="_event: mouseenter; _target: #BombHuggerText; visible: true"
                event-set__leave="_event: mouseleave; _target: #BombHuggerText; visible: false">
                <a-text id="BombHuggerText" value="BombHugger" align="center" visible="false" color="#FFF" position="0 0.6 0" text="width: 3"></a-text>
        </a-plane>
        <!-- ejemplo usod e troika text -->
         <!-- <a-text troika-text="value: Obras maestras; font: #miFuente; color: #fcfcfc;" position="-1.5 3 -4.8"
            align="center">
        </a-text> -->
        <!-- Anti-ImmigrationBirds -->
        <a-plane src="#Anti-ImmigrationBirds" geometry="height: 0.61; width: 0.75" position="0 2.5 -4.9" scale="3 3 3" material="transparent: true"></a-plane>
        <a-plane src="#KissingCoppers" geometry="height: 1; width: 0.7" position="2.8 1.5 -4.9" scale="3 3 3"></a-plane>
        <!-- caja con interaccion -->
        <a-box color="#4CC3D9" position="-3.5 0.5 0"
            event-set__enter="_event: mouseenter; scale: 1.3 1.3 1.3"
            event-set__leave="_event: mouseleave; scale: 1">
        </a-box>
        <!-- caja rotacion -->
         <a-box position="2 1 -3"
       color="#FFC65D"
       animation__click="property: rotation;
                         to: 0 360 0;
                         dur: 1000;
                         startEvents: click">
        </a-box>
        <!-- con animacion continua -->
        <a-box position="-2 1 -3"
          color="#EF2D5E"
          animation__enter="property: rotation;
                            to: 0 360 0;
                            loop: true;
                            dur: 2000;
                            startEvents: mouseenter"
          animation__leave="property: rotation;
                            to: 0 0 0;
                            dur: 500;
                            startEvents: mouseleave">
        </a-box>
       
        <!-- tooltip -->
        <a-entity position="0 1 -3">

        <!-- Tooltip -->
        <a-text id="tooltip"
                value="Hola, soy un tooltip"
                position="0 1 0"
                visible="false"
                align="center"
                color="#FFF">
        </a-text>
        <a-box tooltip></a-box>
        </a-entity>

        <!-- UI panel -->
        <a-box id="btn" position="2.6 1 -0.3" color="#2196F3"></a-box>

        <a-plane id="panel"
                position="0 2 -3"
                width="2"
                height="1"
                color="#222"
                visible="false">
                
        <a-text value="Información del objeto"
                align="center"
                position="0 0 0.1"
                color="#FFF">
        </a-text>

        </a-plane>

        
        

        <!-- cuadro banksy -->
        <a-entity gltf-model="#cuadro" position="-4.9 2 2.5" rotation="90 90 0"></a-entity>
        <!-- <a-plane geometry="height: 3; width: 2" position="-4.9 2 2.5" rotation="0 90 0"></a-plane> -->
        <a-plane geometry="height: 3; width: 2" position="-4.9 2 0" rotation="0 90 0"></a-plane>
        <a-plane geometry="height: 3; width: 2" position="-4.9 2 -2.5" rotation="0 90 0"></a-plane>
        <a-entity gltf-model="#vandalized" position="4.7 0.1 -3" scale="0.05 0.05 0.05" rotation="0 -90 0"></a-entity>
        <!-- 
        ---------------------------
                Luces
        ---------------------------
        -->
        <!-- ambiente escena   -->
        <a-light position="0 2.2 0" light="type: ambient; intensity: 1; color: #c0d6dd"></a-light>
        <a-cylinder position="-2.7 3.9 -4.3" scale="0.1 0.05 0.1" material="emissive: #ffffff; emissiveIntensity: 3"></a-cylinder>
        <a-light rotation="-45 0 0" position="-3 4 -4" light="type: spot; intensity: 3.2; distance: 5.3; decay: 0.02; penumbra: 0.27; angle: 38.4"></a-light>
        <a-cylinder position="0 3.9 -4.3" scale="0.1 0.05 0.1" material="emissive: #ffffff; emissiveIntensity: 3"></a-cylinder>
        <a-light rotation="-45 0 0" position="0.018 4 -4" light="angle: 38.4; decay: 0.02; distance: 5.3; intensity: 3.2; penumbra: 0.27; type: spot"></a-light>
        <a-cylinder position="4.1 3.9 -3.5" scale="0.1 0.05 0.1" material="emissive: #ffffff; emissiveIntensity: 3"></a-cylinder>
        <a-light rotation="-78.8 -90 0" position="3.6 3.6 -3.7" light="angle: 15.5; decay: -0.09; distance: 5.9; intensity: 4; penumbra: 0.2; type: spot"></a-light>
    </a-scene>
<!-- tooltip script -->
    <script>
AFRAME.registerComponent('tooltip', {
  init: function () {
    const el = this.el;
    const tooltip = document.querySelector('#tooltip');

    el.addEventListener('mouseenter', () => {
      tooltip.setAttribute('visible', true);
    });

    el.addEventListener('mouseleave', () => {
      tooltip.setAttribute('visible', false);
    });
  }
});
</script>
<!-- ui panel script -->
 <script>
        document.querySelector('#btn').addEventListener('click', () => {
        const panel = document.querySelector('#panel');
        const visible = panel.getAttribute('visible');
        panel.setAttribute('visible', !visible);
        });
        </script>
</body>
</html>
